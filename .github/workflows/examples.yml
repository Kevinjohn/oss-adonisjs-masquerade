name: examples

on:
  pull_request:
    paths:
      - 'examples/**'
      - 'http/**'
      - 'auth/**'
      - 'native/**'
      - 'account_kit/**'
      - 'stubs/**'
      - 'docs/guide/**'
      - package.json
      - configure.ts
      - src/configure_wiring.ts
      - bin/test_recipe.ts
      - 'bin/test_inertia_*.ts'
      - bin/test_account_kit_demo.ts
      - bin/demo.ts
      - bin/demo_account_kit.ts
      - 'bin/helpers/*account_kit_demo*.ts'
      - '.github/workflows/examples.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  examples:
    # Pull request and scheduled runs start once the repository is public, where hosted minutes
    # are free. Manual and release runs always start.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DB_CLIENT: better-sqlite3
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/native-session/pnpm-lock.yaml
            examples/inertia-react/pnpm-lock.yaml
            examples/inertia-vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Test demo launcher
        run: pnpm quick:test --files=tests/tooling/demo_launcher.spec.ts --files=tests/tooling/demo_account_kit_launcher.spec.ts
      - name: Check documented native-session recipe
        run: pnpm test:recipe --database=sqlite
      # The example depends on a freshly packed local tarball whose integrity changes with every
      # build, so its lockfile cannot be frozen.
      - name: Install native-session example
        working-directory: examples/native-session
        run: pnpm install --no-frozen-lockfile
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.60.0-chromium-${{ runner.os }}
      - name: Install Chromium
        if: ${{ steps.chromium-cache.outputs.cache-hit != 'true' }}
        working-directory: examples/native-session
        run: pnpm dlx playwright@1.60.0 install --with-deps chromium
      - name: Install Chromium system dependencies
        if: ${{ steps.chromium-cache.outputs.cache-hit == 'true' }}
        working-directory: examples/native-session
        run: pnpm dlx playwright@1.60.0 install-deps chromium
      - name: Check runnable Account Kit demo
        env:
          DB_CLIENT: sqlite
          HOST: 127.0.0.1
          PORT: 3398
          SESSION_DRIVER: database
        run: |
          set -euo pipefail
          mkdir -p tmp
          pnpm test:account-kit-demo 2>&1 | tee tmp/account-kit-demo-check.log
      - name: Upload Account Kit demo check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: account-kit-demo-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/account-kit-demo-check.log
            tmp/account-kit-demo-check/check.log
            tmp/account-kit-demo-check/app/tmp/browser/**
          if-no-files-found: error
      - name: Run browser suite
        working-directory: examples/native-session
        env:
          DB_CLIENT: sqlite
          HOST: 127.0.0.1
          PORT: 3391
          SESSION_DRIVER: memory
        run: |
          pnpm test:browser
          pnpm test:browser
      - name: Check runnable Inertia React example
        env:
          DB_CLIENT: sqlite
          HOST: 127.0.0.1
          PORT: 3393
          SESSION_DRIVER: memory
        run: pnpm test:inertia-react
      - name: Check Inertia Vue example
        env:
          DB_CLIENT: sqlite
          HOST: 127.0.0.1
          PORT: 3378
          SESSION_DRIVER: memory
        run: pnpm test:inertia-vue

  with-account-kit:
    # The starter examples that build on Account Kit's examples. Same start condition as above.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example: [hypermedia, inertia_react]
    defaults:
      run:
        working-directory: examples/with_account_kit/${{ matrix.example }}
    env:
      HOST: 127.0.0.1
      LIMITER_STORE: memory
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm kit:pack
      # The packed archive's integrity changes with every build, so the lockfile cannot be frozen.
      - run: pnpm install --no-frozen-lockfile
      - name: Prepare the app
        run: |
          cp .env.example .env
          pnpm exec node ace generate:key --force
          pnpm exec node ace codegen
          pnpm exec node ace migration:run --force
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Test
        run: |
          PLAYWRIGHT_CLI=$(node -p "require('node:path').join(require('node:path').dirname(require.resolve('playwright/package.json', {paths:[require.resolve('@japa/browser-client')]})), 'cli.js')")
          node "$PLAYWRIGHT_CLI" install --with-deps chromium
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/example-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true; wait "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/@vite/client >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/@vite/client >/dev/null
          pnpm test
