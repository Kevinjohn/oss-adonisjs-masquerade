name: docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'typedoc.json'
      - 'index.ts'
      - 'configure.ts'
      - 'src/**'
      - 'auth/**'
      - 'commands/**'
      - 'http/**'
      - 'native/**'
      - 'providers/**'
      - 'stores/**'
      - 'testing/**'
      - 'stubs/**'
      - 'account_kit/**'
      - 'plugins/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'typedoc.json'
      - 'index.ts'
      - 'configure.ts'
      - 'src/**'
      - 'auth/**'
      - 'commands/**'
      - 'http/**'
      - 'native/**'
      - 'providers/**'
      - 'stores/**'
      - 'testing/**'
      - 'stubs/**'
      - 'account_kit/**'
      - 'plugins/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  # Pull request builds get their own group so they never cancel a Pages deployment from main.
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/.vitepress/dist

  deploy:
    # Pull requests only build the site.
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.repository.private && github.event_name == 'push') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
