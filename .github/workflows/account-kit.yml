name: account-kit

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  account-kit:
    # Scheduled runs start once the repository is public, where hosted minutes are free. Manual
    # and release runs always start.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [pg, better-sqlite3]
    env:
      DB_CLIENT: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: masquerade_test
    services:
      postgres:
        image: ${{ matrix.database == 'pg' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: masquerade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise packed Account Kit consumer
        env:
          ACCOUNT_KIT_EVIDENCE_DIR: ${{ github.workspace }}/tmp/account-kit-evidence-${{ matrix.database }}
        run: pnpm test:account-kit --profile=all --database=${{ matrix.database == 'pg' && 'pg' || 'sqlite' }} --strategy=all --session-management=all
      - name: Upload Account Kit consumer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: account-kit-${{ matrix.database }}
          path: |
            tmp/account-kit-evidence-${{ matrix.database }}/evidence.json
            tmp/account-kit-evidence-${{ matrix.database }}/logs/**
          if-no-files-found: warn
