name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Explicit prerelease version (for example 0.1.0-alpha.1)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  consumer:
    uses: ./.github/workflows/consumer.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  account-kit:
    uses: ./.github/workflows/account-kit.yml

  release:
    needs: [checks, consumer, e2e, account-kit]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - name: Validate alpha version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-alpha\.(0|[1-9]\d*)$/.test(process.env.RELEASE_VERSION)) throw new Error("Expected an explicit alpha prerelease version")'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Release
        run: pnpm release "$RELEASE_VERSION" --ci
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
