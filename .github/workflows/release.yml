name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  consumer:
    uses: ./.github/workflows/consumer.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  account-kit:
    uses: ./.github/workflows/account-kit.yml

  release:
    needs: [checks, consumer, e2e, account-kit]
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate immutable release source and prepare notes
        run: node --import=@poppinss/ts-exec bin/prepare_release.ts
      - name: Build immutable source
        run: pnpm build
      - name: Pack release artifact
        run: pnpm pack --out tmp/release_package.tgz
      - name: Inspect release artifact
        run: node --import=@poppinss/ts-exec bin/inspect_release_package.ts
      - name: Publish alpha with provenance
        run: pnpm publish tmp/release_package.tgz --access public --provenance --tag alpha --no-git-checks
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF#refs/tags/}" --verify-tag --prerelease --notes-file tmp/release_notes.md
