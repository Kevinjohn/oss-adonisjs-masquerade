name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its stale run. The workflow name is spelt out because
# `github.workflow` is the caller's name when the release workflow calls this one.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Push and pull request runs start once the repository is public, where hosted minutes are
    # free. Manual and release runs always start.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [pg, better-sqlite3]
    env:
      DB_CLIENT: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: masquerade_test
    services:
      postgres:
        image: ${{ matrix.database == 'pg' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: masquerade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/native-session/pnpm-lock.yaml
            examples/inertia-react/pnpm-lock.yaml
            examples/inertia-vue/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        if: ${{ matrix.database == 'better-sqlite3' }}
        run: pnpm format:check
      - name: Typecheck
        if: ${{ matrix.database == 'better-sqlite3' }}
        run: pnpm typecheck
      - name: Lint
        if: ${{ matrix.database == 'better-sqlite3' }}
        run: pnpm lint
      - name: Build
        if: ${{ matrix.database == 'better-sqlite3' }}
        run: pnpm build
      - name: Test built package exports
        if: ${{ matrix.database == 'better-sqlite3' }}
        run: pnpm test:built-exports
      - run: pnpm test:coverage
